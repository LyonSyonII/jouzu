<main>
  <x-nav />

  <div id="main-content">
    @if (words.hasValue() && currentWord(); as current) {
      <x-card>
        <h1 fitText class="kana-word">
          @for (char of current.chars; track $index) {
            <span class="ruby-stack">
              <span class="ruby-furigana">
                @if (char.word !== char.reading[0]) {
                  {{ char.reading.join("") }}
                }
              </span>
              <span class="ruby-base">
                {{ char.word }}
              </span>
              <span class="ruby-romaji">
                {{ currentWordRomaji()[$index] }}
              </span>
            </span>
          }
        </h1>

        <input pInputText class="kana-input" size="1" [(value)]="answer" />
      </x-card>
    } @else {
      <p-skeleton width="100%" height="100%" />
    }
  </div>
</main>
